# =============================================================================
# Warehouse study template — main configuration
# =============================================================================
# STUDY: Prefer environment variables for secrets.
#   export DB_URL=jdbc:postgresql://localhost:5432/prem_stats
#   export DB_USER=postgres
#   export DB_PASSWORD=yourpassword
#
# This project currently uses the existing local DB "prem_stats".
# That schema also has unrelated tables (player_*). Flyway baseline settings
# below let migrations run even though the schema is not empty.
#
# Later / cleaner option: create a dedicated DB:
#   CREATE DATABASE warehouse;
#   then set DB_URL=.../warehouse and you can turn baseline off.
# =============================================================================

spring.application.name=warehouse

# --- Datasource (PostgreSQL) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/prem_stats}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:bohdan12}

# --- JPA / Hibernate ---
# STUDY: ddl-auto=validate → Hibernate checks entities match Flyway tables (does NOT create schema).
# STUDY: open-in-view=false → no long DB session during JSON rendering.
#        Lazy loads must happen inside @Transactional service methods (see docs/BACKEND_STUDY.md).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Needed when DB already has other tables (e.g. player_*) but no flyway history.
# baseline-version=0 → treat nothing as applied, then run V1..Vn normally.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

server.port=${SERVER_PORT:8080}

# --- Actuator (ops) ---
# STUDY: expose only health/info publicly; lock the rest later.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
