# =============================================================================
# STUDY: Test profile — in-memory H2 so ./mvnw test does not need Postgres.
# Activate with @ActiveProfiles("test")
#
# Flyway is OFF here: Hibernate create-drop builds schema from entities.
# Production/dev still use Flyway + Postgres + ddl-auto=validate.
# =============================================================================

spring.datasource.url=jdbc:h2:mem:warehouse;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=false
